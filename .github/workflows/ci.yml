name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inference:
    name: Inference service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/inference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/inference/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,runtime]"
      - run: python ../../scripts/repository_policy.py
      - run: ruff format --check src tests migrations ../../scripts
      - run: ruff check src tests migrations ../../scripts
      - run: mypy src
      - run: pytest --cov=slatesignal --cov-report=term-missing --cov-report=xml
      - run: pip-audit
      - name: Verify database migration
        env:
          DATABASE_URL: sqlite:////tmp/slatesignal-ci.db
          AUTO_CREATE_SCHEMA: "false"
        run: alembic upgrade head

  containers:
    name: Container builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: services/inference
          push: false
      - uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: false
          build-args: INFERENCE_API_URL=http://api.invalid

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3

  web:
    name: Web application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --coverage
      - run: npm run build

  browser:
    name: Browser journeys
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
